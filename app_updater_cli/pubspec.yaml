name: app_updater_cli
description: >
  One-command build, sign, and upload of app_updater OTA patches for any Flutter project. Wraps the
  same steps as scripts/build_patch_for_project.sh in this repo, but installable and runnable from
  inside a company app's own repo, without cloning this infra repo.
version: 0.1.0
publish_to: 'none'
homepage: https://github.com/berkersaptas/app_updater
repository: https://github.com/berkersaptas/app_updater

environment:
  sdk: ^3.4.0

dependencies:
  args: ^2.5.0
  yaml: ^3.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  crypto: ^3.0.5

executables:
  app_updater:
