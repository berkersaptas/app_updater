name: CLI cross-platform

on:
  push:
    paths:
      - "app_updater_cli/**"
      - ".github/workflows/cli-cross-platform.yml"
  pull_request:
    paths:
      - "app_updater_cli/**"
      - ".github/workflows/cli-cross-platform.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app_updater_cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed bin lib test
      - run: dart analyze
      - run: dart test
